<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Alisio Cars Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: presenter notes column + phone device on desktop; full-bleed app on phones.
   Palette from the island: basalt ink, Atlantic blue accent, picón (volcanic red) for alerts and highlights. */
:root {
  --bg: #eef0ee;
  --panel: #f8f9f7;
  --surface: #ffffff;
  --surface-2: #f2f4f2;
  --ink: #15191c;
  --ink-2: #4b5459;
  --ink-3: #7c868b;
  --line: #dde2e0;
  --accent: #0e5d78;
  --accent-ink: #ffffff;
  --accent-soft: #dcebf0;
  --picon: #b4472c;
  --picon-soft: #f6e3dc;
  --hero: #15191c; --hero-ink: #eef0ee;
  --c1: #0e5d78; --c2: #b4472c; --c3: #2f7a4b; --c4: #b07d12; --c5: #6a4f9a; --c6: #7c868b;
  --good: #2f7a4b;
  --good-soft: #dff0e4;
  --warn: #9a6a12;
  --warn-soft: #f6ecd4;
  --device: #1b2023;
  --shadow: 0 30px 60px -30px rgba(20, 30, 35, .45);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1214; --panel: #14181a; --surface: #1a1f22; --surface-2: #22282b;
    --ink: #e8ecea; --ink-2: #b3bcbf; --ink-3: #849095; --line: #2c3437;
    --accent: #5fb0cc; --accent-ink: #0d1a1f; --accent-soft: #173643;
    --picon: #e2795c; --picon-soft: #3a2119; --good: #6cc48f; --good-soft: #17301f;
    --warn: #e0b45a; --warn-soft: #33290f; --device: #050607;
  --hero: #12394a; --hero-ink: #eaf2f4;
  --c1: #5fb0cc; --c2: #e2795c; --c3: #6cc48f; --c4: #e0b45a; --c5: #a78bdb; --c6: #93a0a5;
    --hero: #12394a; --hero-ink: #eaf2f4;
    --c1: #5fb0cc; --c2: #e2795c; --c3: #6cc48f; --c4: #e0b45a; --c5: #a78bdb; --c6: #93a0a5;
    --shadow: 0 30px 60px -30px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1214; --panel: #14181a; --surface: #1a1f22; --surface-2: #22282b;
  --ink: #e8ecea; --ink-2: #b3bcbf; --ink-3: #849095; --line: #2c3437;
  --accent: #5fb0cc; --accent-ink: #0d1a1f; --accent-soft: #173643;
  --picon: #e2795c; --picon-soft: #3a2119; --good: #6cc48f; --good-soft: #17301f;
  --warn: #e0b45a; --warn-soft: #33290f; --device: #050607;
  --shadow: 0 30px 60px -30px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- stage ---------- */
.stage { min-height: 100%; display: grid; grid-template-columns: minmax(0, 360px) auto; gap: 48px; justify-content: center; align-items: start; padding-block: 40px; padding-inline: 24px; }
.notes { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); display: grid; gap: 22px; padding-top: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { font-family: var(--f-display); font-stretch: 125%; font-weight: 850; font-size: 30px; letter-spacing: -.01em; line-height: 1; }
.brand-mark i { font-style: normal; color: var(--picon); }
.brand-sub { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.concept-tag { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
.ctrl { display: grid; gap: 8px; }
.ctrl-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; width: fit-content; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.model-toggles { display: grid; gap: 6px; }
.mtoggle { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: left; width: 100%; }
.mtoggle .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.mtoggle[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mtoggle .box svg { width: 12px; height: 12px; opacity: 0; }
.mtoggle[aria-pressed="true"] .box svg { opacity: 1; }
.mtoggle b { font-weight: 600; font-size: 13px; }
.note-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
.note-card h3 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 750; font-size: 17px; text-wrap: balance; }
.note-card p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.note-card ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 4px; }
.mobile-bar { display: none; }

/* ---------- device ---------- */
.device { width: 390px; height: min(820px, calc(100dvh - 48px)); min-height: 640px; background: var(--device); border-radius: 52px; padding: 12px; box-shadow: var(--shadow); position: relative; }
.device::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: var(--device); border-radius: 20px; z-index: 5; }
.screen { width: 100%; height: 100%; background: var(--bg); border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.statusbar { height: 50px; flex: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font-size: 13px; font-weight: 600; }
.appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 18px 10px; min-height: 48px; }
.appbar h1 { margin: 0; font-family: var(--f-display); font-stretch: 118%; font-weight: 800; font-size: 22px; letter-spacing: -.01em; flex: 1; min-width: 0; text-wrap: balance; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
.main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.main > * { flex-shrink: 0; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px calc(10px + env(safe-area-inset-bottom, 0px)); }
.tabbar.four { grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 10.5px; font-weight: 600; color: var(--ink-3); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 86px; background: var(--hero); color: var(--hero-ink); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 13px; z-index: 20; transition: opacity .25s, transform .25s; }
.toast[hidden] { display: none !important; }

/* ---------- app components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.card.tight { gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; }
.h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 780; font-size: 18px; margin: 0; text-wrap: balance; }
.h3 { font-weight: 650; font-size: 15px; margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 650; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.picon { background: var(--picon-soft); color: var(--picon); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 650; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--accent); padding: 8px 0; width: auto; }
.btn.small { padding: 8px 12px; font-size: 13px; width: auto; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.divider { height: 1px; background: var(--line); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.kv .total { font-size: 15px; padding-top: 6px; border-top: 1px solid var(--line); }

/* hero / points */
.points-card { background: var(--hero); color: var(--hero-ink); border-radius: 20px; padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.points-card::after { content: ""; position: absolute; right: -70px; top: -70px; width: 170px; height: 170px; border-radius: 50%; border: 18px solid color-mix(in srgb, var(--picon) 70%, transparent); opacity: .45; z-index: 0; pointer-events: none; }
.points-card > * { position: relative; z-index: 1; }
.points-big { font-family: var(--f-display); font-stretch: 125%; font-weight: 850; font-size: 42px; line-height: 1; letter-spacing: -.02em; }
.points-big small { font-size: 16px; font-weight: 700; letter-spacing: 0; margin-left: 4px; }
.points-meta { display: flex; gap: 14px; font-size: 12.5px; opacity: .85; flex-wrap: wrap; position: relative; z-index: 1; }
.tier-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; position: relative; z-index: 1; }
.tier-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--picon); }

/* car tiles */
.car-art { border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; aspect-ratio: 16 / 7; max-width: 100%; position: relative; overflow: hidden; }
.car-art svg { width: 92%; height: auto; }
.car-art.sm { aspect-ratio: 4 / 2.4; }
.car-art.sm svg { width: 100%; }
.car-art .plate { position: absolute; left: 10px; bottom: 8px; font-family: var(--f-mono); font-size: 10.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink-2); }
.car-art .cat { position: absolute; right: 10px; top: 8px; }
.car-list { display: grid; gap: 12px; }
.car-tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px; display: grid; gap: 8px; width: 100%; }
.car-name { font-family: var(--f-display); font-stretch: 110%; font-weight: 760; font-size: 16px; }
.owner { display: flex; align-items: center; gap: 8px; min-width: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.ptsday { font-family: var(--f-display); font-stretch: 115%; font-weight: 800; font-size: 17px; white-space: nowrap; }
.ptsday small { font-size: 11px; font-weight: 600; color: var(--ink-3); }
.spec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.spec { background: var(--surface-2); border-radius: 10px; padding: 8px; display: grid; gap: 1px; }
.spec b { font-size: 14px; font-variant-numeric: tabular-nums; }
.spec span { font-size: 11px; color: var(--ink-3); }

/* calendar strip */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 0; display: grid; justify-items: center; gap: 1px; font-size: 11px; color: var(--ink-3); }
.day b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.day.busy { background: repeating-linear-gradient(-45deg, var(--surface-2), var(--surface-2) 4px, transparent 4px, transparent 8px); color: var(--ink-3); cursor: not-allowed; }
.day.busy b { color: var(--ink-3); text-decoration: line-through; }
.day.weekend b { color: var(--picon); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] b { color: var(--accent-ink); }
.day.inrange { background: var(--accent-soft); border-color: var(--accent-soft); }

/* handover method options */
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.opt .ico { grid-row: span 2; width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); }
.opt .ico svg { width: 20px; height: 20px; }
.ico { display: inline-grid; place-items: center; }
.ico svg { width: 20px; height: 20px; }
.opt .t { font-weight: 650; }
.opt .d { font-size: 12.5px; color: var(--ink-2); }
.opt:disabled { opacity: .45; }

/* list rows */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.plus { color: var(--good); }
.amt.minus { color: var(--ink); }
.chev { color: var(--ink-3); flex: none; width: 16px; height: 16px; }

/* events */
.event { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: start; }
.datebox { background: var(--hero); color: var(--hero-ink); border-radius: 12px; display: grid; justify-items: center; padding: 8px 0; line-height: 1.05; }
.datebox b { font-family: var(--f-display); font-stretch: 120%; font-size: 24px; font-weight: 850; }
.datebox span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; }
.route-line { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.route-line i { width: 14px; height: 2px; background: var(--ink-3); display: inline-block; }

/* inspection */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stepbar { height: 4px; border-radius: 4px; background: var(--line); }
.stepbar.on { background: var(--accent); }
.photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.shot { border: 1.5px dashed var(--line); background: var(--surface); border-radius: 12px; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; gap: 2px; padding: 6px; text-align: center; font-size: 12px; color: var(--ink-2); position: relative; overflow: hidden; }
.shot svg.cam { width: 22px; height: 22px; color: var(--ink-3); }
.shot.done { border-style: solid; border-color: var(--accent); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), var(--surface-2)); color: var(--ink); }
.shot .stamp { position: absolute; left: 6px; bottom: 5px; right: 6px; font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-2); text-align: left; }
.shot .tick { position: absolute; right: 6px; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.shot .tick svg { width: 11px; height: 11px; }
.shot.flag { border-color: var(--picon); }
.range { width: 100%; accent-color: var(--accent); }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--ink); }
.topview { display: grid; place-items: center; }
.topview svg { width: 210px; height: auto; max-width: 100%; }
.zone { fill: var(--surface-2); stroke: var(--ink-3); stroke-width: 1.2; cursor: pointer; transition: fill .15s; }
.zone:hover { fill: var(--accent-soft); }
.zone.pre { fill: var(--warn-soft); stroke: var(--warn); }
.zone.new { fill: var(--picon-soft); stroke: var(--picon); stroke-width: 2; }
.zone-label { font-size: 8px; fill: var(--ink-2); pointer-events: none; font-family: var(--f-body); }
.ai-card { border: 1.5px solid var(--picon); background: color-mix(in srgb, var(--picon-soft) 60%, var(--surface)); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.sign { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; text-align: left; }
.sign .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.sign[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: #fff; }
.sign .box svg { width: 14px; height: 14px; opacity: 0; }
.sign[aria-pressed="true"] .box svg { opacity: 1; }

/* club */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-stretch: 118%; font-size: 22px; font-weight: 820; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); }
.compare { display: grid; gap: 10px; }
.model-card { border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; background: var(--surface); display: grid; gap: 8px; }
.model-card.on { border-color: var(--accent); }
.meter { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.dots { display: flex; gap: 3px; }
.dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.dots i.on { background: var(--accent); }
.proscons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
.proscons ul { margin: 0; padding-left: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.proscons b { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.switch { width: 42px; height: 24px; border-radius: 999px; background: var(--line); border: 0; position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch[aria-pressed="true"] { background: var(--accent); }
.switch[aria-pressed="true"]::after { left: 21px; }
.howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.howto div { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }

    },
    classic: { // 1960s roadster with hardtop (280 SL)
      body: 'M16 62 C16 56 20 53 30 53 L104 51 C110 40 118 36 128 36 L164 36 C170 36 174 40 178 51 L214 53 C222 54 226 57 226 63 L226 70 L16 70 Z',
      glass: 'M112 51 C116 43 121 39 129 39 L162 39 C167 39 170 43 173 51 Z', pillar: 146, wheels: [56, 186], chrome: true,
    },
    compact: { // small mid-engine (Alpine A110)
      body: 'M22 65 C22 58 27 54 40 53 L80 48 C94 35 110 30 126 30 C146 30 160 36 172 47 L198 51 C210 53 218 57 218 64 L218 70 L22 70 Z',
      glass: 'M88 48 C100 38 112 33 126 33 C141 33 153 38 164 48 Z', pillar: 128, wheels: [60, 182],
    },
  };
  const TYPE = { p911: 'rear', gtr: 'gt4', r8: 'mid', f488: 'mid', gt4: 'mid', a110: 'compact', amg: 'gt', sl: 'classic', m4: 'gt4', supra: 'gt' };
  let artSeq = 0;
  const wheel = (x, caliper) => `
      <circle cx="${x}" cy="70" r="15" fill="#15181a"/>
      <circle cx="${x}" cy="70" r="10.5" fill="#b9c0c3"/>
      <circle cx="${x}" cy="70" r="10.5" fill="none" stroke="#7d868a" stroke-width="1"/>
      ${[0, 72, 144, 216, 288].map((a) => `<line x1="${x}" y1="70" x2="${(x + 9.5 * Math.cos(a * Math.PI / 180)).toFixed(1)}" y2="${(70 + 9.5 * Math.sin(a * Math.PI / 180)).toFixed(1)}" stroke="#6b7478" stroke-width="2.2" stroke-linecap="round"/>`).join('')}
      ${caliper ? `<rect x="${x - 7}" y="61" width="6" height="5" rx="1.5" fill="${caliper}"/>` : ''}
      <circle cx="${x}" cy="70" r="2.6" fill="#3a4246"/>`;
  const carSvg = (c) => {
    const b = BODY[TYPE[c.id]] || BODY.gt;
    const id = `cp${(artSeq += 1)}`;
    const caliper = c.cat === 'C' || c.cat === 'D' ? '#d6a51e' : c.cat === 'B' ? '#c3322a' : null;
    const rearX = b.wheels[1] + 34;
    return `<svg viewBox="0 0 240 90" aria-hidden="true">
      <defs><clipPath id="${id}"><path d="${b.body}"/></clipPath>
        <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
        <linearGradient id="${id}w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fb4bd"/><stop offset="1" stop-color="#26343a"/></linearGradient></defs>
      <ellipse cx="120" cy="84" rx="104" ry="4.5" fill="currentColor" opacity=".14"/>
      <path d="${b.body}" fill="${c.color}"/>
      <g clip-path="url(#${id})">
        <rect x="0" y="0" width="240" height="90" fill="url(#${id}g)"/>
        <rect x="0" y="60" width="240" height="12" fill="#000" opacity=".18"/>
        ${b.intake ? `<path d="${b.intake}" fill="#000" opacity=".35"/>` : ''}
        <line x1="${b.pillar}" y1="47" x2="${b.pillar + 2}" y2="64" stroke="#000" stroke-opacity=".2" stroke-width="1"/>
        <circle cx="${b.wheels[0]}" cy="70" r="18.5" fill="#000" opacity=".55"/>
        <circle cx="${b.wheels[1]}" cy="70" r="18.5" fill="#000" opacity=".55"/>
      </g>
      <path d="${b.body}" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="1"/>
      <path d="${b.glass}" fill="url(#${id}w)"/>
      <line x1="${b.pillar}" y1="${b.chrome ? 39 : 31}" x2="${b.pillar}" y2="${b.chrome ? 51 : 47}" stroke="${c.color}" stroke-width="3"/>
      <ellipse cx="${b.chrome ? 22 : 19}" cy="${b.chrome ? 57 : 58}" rx="5" ry="2.6" fill="#f3f0e2" opacity=".95"/>
      <rect x="${rearX - 6}" y="${b.chrome ? 54 : 52}" width="6" height="3.2" rx="1.2" fill="#c8261c"/>
      ${b.chrome ? '<rect x="14" y="62" width="10" height="2.4" rx="1.2" fill="#d9dee0"/><rect x="216" y="62" width="11" height="2.4" rx="1.2" fill="#d9dee0"/>' : ''}
      ${c.id === 'gt4' ? `<path d="M196 40 L222 38 L222 41 L198 43 Z" fill="#1d2124"/><line x1="206" y1="42" x2="204" y2="47" stroke="#1d2124" stroke-width="2"/>` : ''}
      ${wheel(b.wheels[0], caliper)}${wheel(b.wheels[1], caliper)}
    </svg>`;
  };
  // big = full-width art with plate and category; small thumbnails stay clean
  const art = (c, big = true) => `<div class="car-art${big ? '' : ' sm'}">${carSvg(c)}${big ? `<span class="plate">${c.plate}</span><span class="cat">${catPill(c)}</span>` : ''}</div>`;
  const catPill = (c) => `<span class="pill ${c.cat === 'D' ? 'picon' : c.cat === 'C' ? 'warn' : 'accent'}">${c.classic ? t().classic + ' · ' : ''}${t().cat[c.cat]}</span>`;
  const avatar = (m) => `<span class="avatar" style="background:${MEMBERS[m].color}">${MEMBERS[m].ini}</span>`;
  const modelIcon = (m) => (m === 'garage' ? I.wrench : m === 'club' ? I.shield : I.people);

  // ---------------------------------------------------------------- navigation
  const go = (name, params = {}) => { S.history.push(S.route); S.route = { name, ...params }; render(true); };
  const back = () => { S.route = S.history.pop() || { name: S.mode === 'club' ? 'panel' : 'home' }; render(true); };
  const tab = (name) => { S.history = []; S.route = { name }; render(true); };
  let toastTimer;
  const toast = (msg) => {
    const el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  };

  // ---------------------------------------------------------------- screens (member)
  const screens = {};

  screens.home = () => {
    const s1 = S.swaps.find((s) => s.status === 'active') || S.swaps.find((s) => s.status === 'confirmed');
    const c1 = s1 && car(s1.car);
    const ev = EVENTS()[0];
    const how = S.showHow ? `
      <div class="card">
        <div class="between"><span class="h3">${t().howTitle}</span><button class="btn ghost small" data-action="hideHow">${t().hide}</button></div>
        <div class="howto">${t().how.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join('')}</div>
      </div>` : '';
    return {
      title: t().hello,
      body: `
      <div class="points-card">
        <span class="tier-badge">${t().tier}</span>
        <div class="points-big num">${fmt(S.balance)}<small>${t().pts}</small></div>
        <div class="points-meta"><span>320 ${t().pts} ${t().expiring}</span><span>+${fmt(1085)} ${t().pts} ${t().earnedYear}</span></div>
      </div>
      ${how}
      ${s1 ? `
      <button class="card" style="text-align:left" data-action="go" data-v="swap" data-id="${s1.id}">
        <div class="between"><span class="eyebrow">${t().nextSwap}</span>${statusPill(s1)}</div>
        <div class="row">
          <div style="width:110px;flex:none">${art(c1, false)}</div>
          <div class="grow"><div class="car-name">${c1.name}</div><div class="faint">${dLong(s1.from)} → ${dLong(addDays(s1.from, s1.days - 1))}</div><div class="faint">${t().models[s1.model]}</div></div>
        </div>
      </button>` : ''}
      <div class="card">
        <span class="eyebrow">${t().yourCar}</span>
        <div class="row">
          <div style="width:110px;flex:none">${art(car('m4'), false)}</div>
          <div class="grow"><div class="car-name">BMW M4</div><div class="faint">${t().lentTo} Laura S. ${t().until} ${dLong(addDays(today, 2))}</div><div class="pill good" style="margin-top:4px">${t().earning} +200 ${t().pts}</div></div>
        </div>
      </div>
      <button class="card" style="text-align:left" data-action="tab" data-v="events">
        <span class="eyebrow">${t().nextRoute}</span>
        <div class="event">
          <div class="datebox"><b>${ev.date.getDate()}</b><span>${dMon(ev.date)}</span></div>
          <div style="display:grid;gap:4px"><span class="h3">${ev.name}</span><div class="route-line">${ev.route.map((r, i) => (i ? '<i></i>' : '') + r).join('')}</div><span class="faint">${ev.going} ${t().attendees}</span></div>
        </div>
      </button>`,
    };
  };

  screens.explore = () => {
    const filters = ['all', 'A', 'B', 'C', 'D'];
    const list = CARS.filter((c) => !c.mine && (S.filter === 'all' || c.cat === S.filter));
    return {
      title: t().explore,
      body: `
      <div class="faint">${t().search}</div>
      <div class="chips">${filters.map((f) => `<button class="chip" aria-pressed="${S.filter === f}" data-action="filter" data-v="${f}">${f === 'all' ? t().all : t().cat[f]}</button>`).join('')}</div>
      <div class="car-list">
        ${list.map((c) => `
        <button class="car-tile" data-action="go" data-v="car" data-id="${c.id}">
          ${art(c)}
          <div class="between"><div style="min-width:0"><div class="car-name">${c.name}</div><div class="route-line">${I.pin}${c.town}</div></div><div class="ptsday num">${c.pts}<small> ${t().pts}${t().perDay}</small></div></div>
          <div class="owner">${avatar(c.owner)}<span class="faint">${MEMBERS[c.owner].name} · ★ ${MEMBERS[c.owner].rating.toFixed(1)}</span></div>
        </button>`).join('')}
      </div>`,
    };
  };

  screens.car = () => {
    const c = car(S.route.id); const m = MEMBERS[c.owner];
    const days = Array.from({ length: 14 }, (_, i) => addDays(today, i + 1));
    return {
      title: c.name, back: true,
      body: `
      ${art(c, true)}
      <div class="between"><div><div class="car-name" style="font-size:20px">${c.name}</div><div class="faint">${c.gen ? c.gen + ' · ' : ''}${c.year}</div></div><div class="ptsday num" style="font-size:22px">${c.pts}<small> ${t().pts}${t().perDay}</small></div></div>
      <div class="spec-grid">
        <div class="spec"><b>${c.hp}</b><span>${t().power}</span></div>
        <div class="spec"><b>${c.acc}</b><span>${t().zeroTo}</span></div>
        <div class="spec"><b>${c.box === 'manual' ? t().manual : t().auto}</b><span>${t().gearbox}</span></div>
      </div>
      <div class="card tight">
        <div class="owner">${avatar(c.owner)}<div class="grow"><div class="h3">${m.name}</div><div class="faint">${t().ownerSince} ${m.since} · ${m.swaps} ${t().swapsDone} · ★ ${m.rating.toFixed(1)}</div></div></div>
        <div class="route-line">${I.pin}${c.town}</div>
      </div>
      <div class="card">
        <span class="h3">${t().availability}</span>
        <div class="cal">${days.map((d) => `<div class="day ${busy(c, d) ? 'busy' : ''} ${isWeekend(d) ? 'weekend' : ''}"><span>${dWk(d)}</span><b>${d.getDate()}</b></div>`).join('')}</div>
      </div>
      <div class="card tight">
        <span class="h3">${t().ownerRules}</span>
        <dl class="kv">
          <dt>${t().kmIncluded}</dt><dd>${c.kmDay}</dd>
          <dt>${t().minTier}</dt><dd>${c.minTier}</dd>
          ${c.garageOnly ? `<dt>${t().garageOnly}</dt><dd>✓</dd>` : ''}
        </dl>
      </div>
      <button class="btn" data-action="startReq" data-id="${c.id}">${t().requestSwap}</button>`,
    };
  };

  const allowedModels = (c) => {
    const restricted = c.garageOnly || (S.catRule && (c.cat === 'C' || c.cat === 'D'));
    return ['garage', 'club', 'peer'].map((m) => ({ m, on: S.models[m] && (!restricted || m === 'garage'), off: !S.models[m] }));
  };

  screens.request = () => {
    const c = car(S.req.car);
    const days = Array.from({ length: 14 }, (_, i) => addDays(today, i + 1));
    const start = S.req.start;
    const q = start ? quote(c, start, S.req.days) : null;
    const opts = allowedModels(c);
    if (!opts.find((o) => o.m === S.req.model && o.on)) { const first = opts.find((o) => o.on); S.req.model = first ? first.m : null; }
    const rangeEnd = start ? addDays(start, S.req.days - 1) : null;
    const overlaps = start && Array.from({ length: S.req.days }, (_, i) => addDays(start, i)).some((d) => busy(c, d));
    const afford = q && q.total <= S.balance;
    const canSend = q && afford && !overlaps && S.req.model;
    return {
      title: `${t().reqTitle} · ${c.name.split(' ').slice(0, 2).join(' ')}`, back: true,
      body: `
      <div class="card">
        <span class="h3">${t().startDay}</span>
        <div class="cal">${days.map((d) => {
          const b = busy(c, d); const sel = start && d.getTime() === start.getTime();
          const inr = start && d > start && d <= rangeEnd;
          return `<button class="day ${b ? 'busy' : ''} ${isWeekend(d) ? 'weekend' : ''} ${inr ? 'inrange' : ''}" ${b ? 'disabled' : ''} aria-pressed="${!!sel}" data-action="pickDay" data-v="${d.getTime()}"><span>${dWk(d)}</span><b>${d.getDate()}</b></button>`;
        }).join('')}</div>
        <span class="h3">${t().duration}</span>
        <div class="chips">${[1, 2, 3, 5, 7].map((n) => `<button class="chip" aria-pressed="${S.req.days === n}" data-action="pickDur" data-v="${n}">${n} ${n === 1 ? t().day : t().days}</button>`).join('')}</div>
        ${overlaps ? `<span class="pill picon">${S.lang === 'es' ? 'Algún día ya está ocupado' : 'Some days are already taken'}</span>` : ''}
      </div>
      <div class="card">
        <span class="h3">${t().handover}</span>
        ${opts.map(({ m, on, off }) => `
          <button class="opt" ${on ? '' : 'disabled'} aria-pressed="${S.req.model === m}" data-action="pickModel" data-v="${m}">
            <span class="ico">${modelIcon(m)}</span>
            <span class="t">${t().models[m]}</span>
            <span class="d">${off ? t().disabledModel : on ? t().modelDesc[m] : t().garageOnly}</span>
          </button>`).join('')}
      </div>
      ${q ? `
      <div class="card">
        <span class="h3">${t().costTitle}</span>
        <dl class="kv">
          <dt>${t().base} · ${S.req.days} × ${c.pts}</dt><dd>${fmt(q.base)}</dd>
          ${q.weekend ? `<dt>${t().weekend}</dt><dd>+${fmt(q.weekend)}</dd>` : ''}
          ${q.season ? `<dt>${t().season}</dt><dd>+${fmt(q.season)}</dd>` : ''}
          <dt class="total">${t().total}</dt><dd class="total">${fmt(q.total)} ${t().pts}</dd>
          <dt>${t().balanceAfter}</dt><dd>${fmt(S.balance - q.total)} ${t().pts}</dd>
        </dl>
        <div class="faint">${MEMBERS[c.owner].name} ${t().ownerGets} (${fmt(Math.round(q.total * 0.7))} ${t().pts}) · ${c.kmDay} ${t().kmIncluded}</div>
        ${!afford ? `<span class="pill picon">${t().notEnough}</span>` : ''}
      </div>` : ''}
      <button class="btn" ${canSend ? '' : 'disabled'} data-action="sendReq">${t().send}</button>`,
    };
  };

  const statusPill = (s) => {
    const map = { pending: ['warn', t().pending], confirmed: ['accent', t().confirmed], active: ['good', t().inProgress], done: ['', t().done] };
    const [cls, label] = map[s.status];
    return `<span class="pill ${cls}">${label}</span>`;
  };

  screens.swaps = () => {
    const groups = [
      [t().active, S.swaps.filter((s) => s.status === 'active')],
      [t().upcoming, S.swaps.filter((s) => s.status === 'confirmed' || s.status === 'pending')],
      [t().past, S.swaps.filter((s) => s.status === 'done')],
    ].filter(([, l]) => l.length);
    return {
      title: t().swapsTitle,
      body: groups.map(([label, list]) => `
        <span class="eyebrow">${label}</span>
        ${list.map((s) => { const c = car(s.car); return `
        <button class="card" style="text-align:left" data-action="go" data-v="swap" data-id="${s.id}">
          <div class="row"><div style="width:96px;flex:none">${art(c, false)}</div>
            <div class="grow"><div class="car-name" style="font-size:15px">${c.name}</div><div class="faint">${t().cat[c.cat]} · ${dLong(s.from)} · ${s.days} ${s.days === 1 ? t().day : t().days}</div><div class="row" style="gap:6px;margin-top:4px">${statusPill(s)}<span class="faint num">${fmt(s.cost)} ${t().pts}</span></div></div>
          </div>
        </button>`; }).join('')}`).join(''),
    };
  };

  screens.swap = () => {
    const s = S.swaps.find((x) => x.id === S.route.id); const c = car(s.car);
    const canInspect = s.status === 'active' || s.status === 'confirmed';
    return {
      title: c.name, back: true,
      body: `
      ${art(c, true)}
      <div class="between"><div class="car-name" style="font-size:19px">${c.name}</div>${statusPill(s)}</div>
      <div class="card tight">
        <dl class="kv">
          <dt>${t().startDay}</dt><dd>${dLong(s.from)}</dd>
          <dt>${t().duration}</dt><dd>${s.days} ${s.days === 1 ? t().day : t().days}</dd>
          <dt>${t().total}</dt><dd>${fmt(s.cost)} ${t().pts}</dd>
        </dl>
        <div class="owner">${avatar(c.owner)}<span class="faint">${MEMBERS[c.owner].name}</span></div>
      </div>
      <div class="card">
        <div class="opt" aria-pressed="true" style="cursor:default"><span class="ico">${modelIcon(s.model)}</span><span class="t">${t().models[s.model]}</span><span class="d">${t().modelWhere[s.model]}</span></div>
        <div class="faint">${t().modelDesc[s.model]}</div>
      </div>
      ${canInspect ? `<button class="btn" data-action="startInsp" data-id="${s.id}">${s.phase === 'checkin' ? t().checkin : t().checkout}</button>` : ''}`,
    };
  };

  screens.inspection = () => {
    const s = S.swaps.find((x) => x.id === S.insp.swap); const c = car(s.car); const x = S.insp;
    const isReturn = x.phase === 'checkin';
    const stepsBar = `<div class="steps">${t().steps.map((_, i) => `<div class="stepbar ${i <= x.step ? 'on' : ''}"></div>`).join('')}</div>
      <div class="between" style="flex-wrap:wrap"><span class="eyebrow">${t().step} ${x.step + 1}/4 · ${t().steps[x.step]}</span><span class="pill">${t().performedBy}: ${s.model === 'garage' ? (S.lang === 'es' ? 'técnico del taller' : 'garage technician') : s.model === 'club' ? (S.lang === 'es' ? 'equipo del club' : 'club team') : (S.lang === 'es' ? 'ambos socios' : 'both members')}</span></div>`;
    let body = '';
    let canNext = true;
    if (x.step === 0) {
      const done = x.photos.size;
      canNext = done === 8;
      body = `<div class="faint">${t().photosHint}</div>
        <div class="photo-grid">${t().angles.map((a, i) => {
          const ok = x.photos.has(i);
          const flagged = isReturn && i === 4 && ok && x.ai !== 'dismissed';
          return `<button class="shot ${ok ? 'done' : ''} ${flagged ? 'flag' : ''}" data-action="shot" data-v="${i}">
            ${ok ? `<span class="tick">${I.check}</span>` : I.cam}<b style="font-size:12.5px">${a}</b>
            ${ok ? `<span class="stamp">${new Date().toLocaleTimeString(S.lang === 'es' ? 'es-ES' : 'en-GB', { hour: '2-digit', minute: '2-digit' })} · 28.10°N 15.42°W</span>` : ''}
          </button>`; }).join('')}</div>
        <div class="between"><span class="faint num">${done}/8</span>${done < 8 ? `<button class="btn ghost small" data-action="allShots">${S.lang === 'es' ? 'Hacer todas (demo)' : 'Take all (demo)'}</button>` : ''}</div>`;
    } else if (x.step === 1) {
      const outKm = 18240; const driven = Math.max(0, x.km - outKm); const incl = c.kmDay * s.days;
      body = `
        <div class="card">
          <label class="h3" for="odo">${t().odometer}</label>
          <input class="input mono" id="odo" type="number" inputmode="numeric" value="${x.km}" data-input="km">
          ${isReturn ? `<div class="kv"><dt>${t().drivenKm}</dt><dd>${fmt(driven)}</dd><dt>${t().included}</dt><dd>${fmt(incl)}</dd>${driven > incl ? `<dt>${t().extraKm}</dt><dd style="color:var(--picon)">${fmt(driven - incl)}</dd>` : ''}</div>` : ''}
        </div>
        <div class="card">
          <div class="between"><label class="h3" for="fuel">${t().fuel}</label><span class="mono">${x.fuel}%</span></div>
          <input class="range" id="fuel" type="range" min="0" max="100" step="5" value="${x.fuel}" data-input="fuel">
          ${isReturn ? `<div class="faint">${t().fuelOut}: 90%</div>` : ''}
        </div>`;
    } else if (x.step === 2) {
      const z = (id, attrs, label, lx, ly) => {
        const st = x.damage[id];
        return `<g><rect class="zone ${st || ''}" ${attrs} rx="6" data-action="zone" data-v="${id}"/>${label ? `<text class="zone-label" x="${lx}" y="${ly}" text-anchor="middle">${t().zones[id]}</text>` : ''}</g>`;
      };
      const ai = isReturn && x.ai === null ? `
        <div class="ai-card">
          <div class="row" style="color:var(--picon);font-weight:700">${I.spark}<span>${t().aiTitle}</span></div>
          <div>${t().aiText} <span class="faint">78% ${t().confidence}</span></div>
          <div class="btn-row"><button class="btn small" data-action="ai" data-v="confirm">${t().confirmDmg}</button><button class="btn small secondary" data-action="ai" data-v="dismiss">${t().dismiss}</button></div>
        </div>` : '';
      body = `<div class="faint">${t().damagesHint}</div>
        ${ai}
        <div class="card topview">
          <svg viewBox="0 0 200 330" role="img" aria-label="car">
            ${z('front', 'x="45" y="8" width="110" height="26"', 1, 100, 25)}
            ${z('hood', 'x="45" y="38" width="110" height="70"', 1, 100, 77)}
            ${z('roof', 'x="52" y="112" width="96" height="104"', 1, 100, 168)}

            <span>${t().effort}</span>${dots(scores[m].effort)}
          </div>
          <div class="proscons"><div><b style="color:var(--good)">${t().pros}</b><ul>${t().pc[m][0].map((p) => `<li>${p}</li>`).join('')}</ul></div><div><b style="color:var(--picon)">${t().cons}</b><ul>${t().pc[m][1].map((p) => `<li>${p}</li>`).join('')}</ul></div></div>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="between"><span>${t().catRule}</span><button class="switch" aria-label="${t().catRule}" aria-pressed="${S.catRule}" data-action="catRule"></button></div>
      </div>
      <div class="card tight">
        <span class="eyebrow">${t().recommend}</span>
        <span>${t().recommendText}</span>
      </div>`,
    };
  };

  // ---------------------------------------------------------------- render
  const MEMBER_TABS = [['home', I.home], ['explore', I.car], ['swaps', I.swap], ['events', I.flag], ['garage', I.garage]];
  const CLUB_TABS = [['panel', I.gauge], ['requests', I.inbox], ['inspections', I.clip], ['revenue', I.euro], ['settings', I.cog]];
  const TAB_OF = { car: 'explore', request: 'explore', swap: 'swaps', inspection: 'swaps', ledger: 'garage', addCar: 'garage' };

  const renderNotes = () => {
    const [h, p, list] = NOTES[S.lang][S.route.name] || NOTES[S.lang].home;
    const seg = (action, v, label, on) => `<button data-action="${action}" data-v="${v}" aria-pressed="${on}">${label}</button>`;
    document.getElementById('notes').innerHTML = `
      <div class="brand"><span class="brand-mark">Alisio<i>.</i></span></div>
      <span class="brand-sub">${t().brandSub}</span>
      <div class="concept-tag">${t().concept}</div>
      <div class="ctrl"><span class="ctrl-label">${t().language}</span><div class="seg">${seg('lang', 'es', 'Español', S.lang === 'es')}${seg('lang', 'en', 'English', S.lang === 'en')}</div></div>
      <div class="ctrl"><span class="ctrl-label">${t().view}</span><div class="seg">${seg('mode', 'member', t().member, S.mode === 'member')}${seg('mode', 'club', t().club, S.mode === 'club')}</div></div>
      <div class="ctrl"><span class="ctrl-label">${t().modelsLabel}</span><div class="model-toggles">${['garage', 'club', 'peer'].map((m) => `<button class="mtoggle" aria-pressed="${S.models[m]}" data-action="model" data-v="${m}"><span class="box">${I.check}</span><b>${t().models[m]}</b></button>`).join('')}</div></div>
      <div class="note-card"><h3>${h}</h3><p>${p}</p>${list.length ? `<ul>${list.map((x) => `<li>${x}</li>`).join('')}</ul>` : ''}</div>
      <button class="btn ghost small" data-action="reset">${t().demoReset}</button>`;
    ['es', 'en'].forEach((l) => { document.getElementById('m-lang-' + l).setAttribute('aria-pressed', S.lang === l); });
    ['member', 'club'].forEach((m) => { const b = document.getElementById('m-mode-' + m); b.textContent = t()[m]; b.setAttribute('aria-pressed', S.mode === m); });
  };

  const render = (scrollTop) => {
    document.documentElement.lang = S.lang;
    const scr = (screens[S.route.name] || screens.home)();
    document.getElementById('appbar').innerHTML = `${scr.back ? `<button class="iconbtn" aria-label="Back" data-action="back">${I.back}</button>` : ''}<h1>${scr.title}</h1>`;
    const main = document.getElementById('main');
    main.innerHTML = scr.body;
    if (scrollTop) { main.scrollTop = 0; try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }
    const tabs = S.mode === 'club' ? CLUB_TABS : MEMBER_TABS;
    const current = TAB_OF[S.route.name] || S.route.name;
    const bar = document.getElementById('tabbar');
    bar.className = 'tabbar' + (tabs.length === 4 ? ' four' : '');
    bar.innerHTML = tabs.map(([id, icon]) => `<button class="tab" data-action="tab" data-v="${id}" ${current === id ? 'aria-current="page"' : ''}>${icon}<span>${t().tabs[id]}</span></button>`).join('');
    renderNotes();
    updateRev();
    watchRevTotal();
  };

  let revObserver = null;
  const watchRevTotal = () => {
    if (revObserver) { revObserver.disconnect(); revObserver = null; }
    const card = document.getElementById('rev-total'); const bar = document.getElementById('rev-sticky');
    if (!card || !bar || !('IntersectionObserver' in window)) return;
    revObserver = new IntersectionObserver(([entry]) => {
      const show = entry.intersectionRatio < 0.35 && entry.boundingClientRect.top < entry.rootBounds.top + 20;
      bar.classList.toggle('on', show);
    }, { root: document.getElementById('main'), threshold: [0, 0.35, 0.6, 1] });
    revObserver.observe(card);
  };

  // ---------------------------------------------------------------- actions
  const actions = {
    go: (el) => go(el.dataset.v, { id: el.dataset.id }),
    back: () => back(),
    tab: (el) => tab(el.dataset.v),
    lang: (el) => { S.lang = el.dataset.v; try { localStorage.setItem('alisio-lang', S.lang); } catch (e) { /* ignore */ } render(); },
    mode: (el) => { S.mode = el.dataset.v; S.history = []; S.route = { name: S.mode === 'club' ? 'panel' : 'home' }; render(true); },
    model: (el) => { const m = el.dataset.v; S.models[m] = !S.models[m]; if (!enabledModels().length) S.models[m] = true; render(); },
    catRule: () => { S.catRule = !S.catRule; render(); },
    revPlatform: () => { S.rev.showPlatform = !S.rev.showPlatform; render(); },
    revStep: (el) => {
      const input = document.querySelector(`input[data-rev="${el.dataset.k}"]`);
      if (!input) return;
      const step = Number(input.step); const dec = (input.step.split('.')[1] || '').length;
      const next = Math.min(Number(input.max), Math.max(Number(input.min), Number(input.value) + step * Number(el.dataset.d)));
      setRev(el.dataset.k, Number(next.toFixed(dec)), input);
    },
    hideHow: () => { S.showHow = false; render(); },
    filter: (el) => { S.filter = el.dataset.v; render(); },
    startReq: (el) => { S.req = { car: el.dataset.id, start: null, days: 2, model: null }; go('request'); },
    pickDay: (el) => { S.req.start = new Date(Number(el.dataset.v)); render(); },
    pickDur: (el) => { S.req.days = Number(el.dataset.v); render(); },
    pickModel: (el) => { S.req.model = el.dataset.v; render(); },
    sendReq: () => {
      const c = car(S.req.car); const q = quote(c, S.req.start, S.req.days);
      S.swaps.unshift({ id: 's' + Date.now(), car: c.id, from: S.req.start, days: S.req.days, model: S.req.model, status: 'pending', cost: q.total });
      S.req = null; S.history = []; S.route = { name: 'swaps' }; render(true); toast(t().sent);
    },
    startInsp: (el) => {
      const s = S.swaps.find((x) => x.id === el.dataset.id);
      S.insp = { swap: s.id, phase: s.phase, step: 0, photos: new Set(), km: s.phase === 'checkin' ? 18812 : 18240, fuel: s.phase === 'checkin' ? 65 : 90, damage: { hood: 'pre' }, ai: s.phase === 'checkin' ? null : 'n/a', signed: { a: false, b: false } };
      go('inspection');
    },
    shot: (el) => { const i = Number(el.dataset.v); if (S.insp.photos.has(i)) S.insp.photos.delete(i); else S.insp.photos.add(i); render(); },
    allShots: () => { for (let i = 0; i < 8; i += 1) S.insp.photos.add(i); render(); },
    inspNext: () => { S.insp.step = Math.min(3, S.insp.step + 1); render(true); },
    inspPrev: () => { S.insp.step = Math.max(0, S.insp.step - 1); render(true); },
    zone: (el) => { const z = el.dataset.v; const d = S.insp.damage; if (d[z] === 'pre') return; if (d[z]) delete d[z]; else d[z] = 'new'; render(); },
    ai: (el) => { if (el.dataset.v === 'confirm') { S.insp.damage.wrr = 'new'; S.insp.ai = 'confirmed'; toast(t().aiConfirmed); } else { S.insp.ai = 'dismissed'; toast(t().aiDismissed); } render(); },
    sign: (el) => { S.insp.signed[el.dataset.v] = !S.insp.signed[el.dataset.v]; render(); },
    inspFinish: () => {
      const s = S.swaps.find((x) => x.id === S.insp.swap);
      if (s.phase === 'checkin') { s.status = 'done'; s.phase = null; } else { s.status = 'active'; s.phase = 'checkin'; }
      S.insp = null; S.history = []; S.route = { name: 'swaps' }; render(true); toast(t().inspDone);
    },
    rsvp: (el) => { S.rsvp[el.dataset.v] = !S.rsvp[el.dataset.v]; render(); },
    borrow: (el) => { S.borrow[el.dataset.v] = !S.borrow[el.dataset.v]; render(); },
    list: (el) => { S.listed[el.dataset.v] = !S.listed[el.dataset.v]; render(); },
    toast: (el) => toast(el.dataset.v === 'blockDates' ? (S.lang === 'es' ? 'Calendario de bloqueos (próximamente en la demo)' : 'Blocking calendar (coming to the demo)') : ''),
    submitCar: () => { S.history = []; S.route = { name: 'garage' }; render(true); toast(t().carSent); },
    clubReq: (el) => { const r = S.clubReqs.find((x) => x.id === el.dataset.id); r.state = el.dataset.v; render(); },
    reset: () => { const l = S.lang; S = fresh(); S.lang = l; render(true); },
  };

  const setRev = (k, value, input) => {
    let val = value;
    // keep Plus + Élite within 100%
    if (k === 'plus') val = Math.min(val, 100 - S.rev.elite);
    if (k === 'elite') val = Math.min(val, 100 - S.rev.plus);
    if (input && Number(input.value) !== val) input.value = val;
    S.rev[k] = val; updateRev();
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const rk = e.target.dataset && e.target.dataset.rev;
    if (rk) { setRev(rk, Number(e.target.value), e.target); return; }
    const k = e.target.dataset && e.target.dataset.input;
    if (!k || !S.insp) return;
    S.insp[k] = Number(e.target.value) || 0;
    if (k === 'fuel') { const lab = e.target.closest('.card').querySelector('.mono'); if (lab) lab.textContent = S.insp.fuel + '%'; }
  });
  document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.input === 'km') render(); });

  render(true);
})();
</script>
</body>
</html>
